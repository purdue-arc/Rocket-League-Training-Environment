[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autonRL"
version = "0.1.0"
description = "Package for Autonomous Rocket Leauge Stuff"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["carSoccer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]